name: SavingsApp
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
targets:
  SavingsApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benja.cappuccinosavings
        PRODUCT_NAME: SavingsApp
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SKIP_INSTALL: NO
    scheme:
      testTargets:
        - SavingsAppTests
      gatherCoverageData: true
      coverageTargets:
        - SavingsApp
  SavingsAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SavingsApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.benja.cappuccinosavings.tests
        GENERATE_INFOPLIST_FILE: YES

