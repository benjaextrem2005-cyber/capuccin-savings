name: Compilar Cappuccino para iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Instalar XcodeGen y generar el proyecto
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodebuild -version
          xcodegen generate --spec project.yml

      - name: Elegir un simulador iPhone disponible
        id: simulator
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          import subprocess

          sdk_version = subprocess.check_output([
              "xcrun", "--sdk", "iphonesimulator", "--show-sdk-version"
          ], text=True).strip()
          sdk_parts = sdk_version.split(".")
          sdk = (int(sdk_parts[0]), int(sdk_parts[1]) if len(sdk_parts) > 1 else 0)
          devices = json.loads(subprocess.check_output([
              "xcrun", "simctl", "list", "devices", "available", "--json"
          ]))["devices"]
          candidates = []
          for runtime, entries in devices.items():
              match = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not match or int(match.group(1)) < 17:
                  continue
              version = tuple(int(part) for part in match.groups())
              if version > sdk:
                  continue
              for device in entries:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      candidates.append((version, device["name"], device["udid"]))
          if not candidates:
              raise SystemExit(f"No hay un iPhone disponible con iOS entre 17.0 y el SDK {sdk_version}.")
          _, name, udid = sorted(candidates, reverse=True)[0]
          print(f"Simulador: {name} ({udid})")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"udid={udid}\n")
          PY

      - name: Ejecutar pruebas unitarias
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          xcodebuild test \
            -project SavingsApp.xcodeproj \
            -scheme SavingsApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Archivar para iPhone sin firma
        run: |
          xcodebuild archive \
            -project SavingsApp.xcodeproj \
            -scheme SavingsApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SavingsApp.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Empaquetar IPA para firma local
        run: |
          mkdir -p build/package/Payload
          ditto build/SavingsApp.xcarchive/Products/Applications/SavingsApp.app \
            build/package/Payload/SavingsApp.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/package/Payload build/Cappuccino-unsigned.ipa
          unzip -t build/Cappuccino-unsigned.ipa

      - name: Publicar archivo IPA
        uses: actions/upload-artifact@v7
        with:
          name: Cappuccino-unsigned-IPA
          path: build/Cappuccino-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Cappuccino-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
